# v3 Declarative Google MCP Toolbox Config (AWS Operational Databases Only)
# Note: In v3, 100% of Google Cloud BigQuery queries & schema discovery route
# through BigQuery's native remote MCP server (`https://bigquery.googleapis.com/mcp`).

sources:
  aws_postgres_v3:
    kind: postgres
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DB:finance_db}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  aws_mysql_v3:
    kind: mysql
    host: ${MYSQL_HOST}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DB:engagement_db}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

tools:
  pg_get_customer_360_v2:
    kind: postgres-sql
    source: aws_postgres_v3
    description: >-
      Look up a customer in AWS PostgreSQL (finance_db) by exact email or full
      name, returning customer ID, accounts, balances, and transaction rollups.
    parameters:
      - name: search_term
        type: string
        description: Customer email address (e.g. 'james.smith@example.com') or full name.
    statement: |
      WITH matched_cust AS (
        SELECT id, name, email
        FROM customers
        WHERE email = $1 OR name = $1
        ORDER BY id ASC
        LIMIT 5
      ),
      matched_accts AS (
        SELECT a.id AS account_id, a.customer_id, a.type AS account_type, a.balance
        FROM accounts a
        WHERE a.customer_id IN (SELECT id FROM matched_cust)
        LIMIT 20
      ),
      tx_rollup AS (
        SELECT t.account_id, COUNT(*) AS tx_count, SUM(t.amount) AS net_tx_amount
        FROM transactions t
        WHERE t.account_id IN (SELECT account_id FROM matched_accts)
        GROUP BY t.account_id
      )
      SELECT
        c.id AS customer_id,
        c.name,
        c.email,
        ma.account_id,
        ma.account_type,
        ma.balance::FLOAT8 AS balance,
        COALESCE(tx.tx_count, 0) AS recent_tx_count,
        COALESCE(tx.net_tx_amount, 0)::FLOAT8 AS net_tx_amount
      FROM matched_cust c
      LEFT JOIN matched_accts ma ON ma.customer_id = c.id
      LEFT JOIN tx_rollup tx ON tx.account_id = ma.account_id;

  pg_batch_accounts_by_emails_v2:
    kind: postgres-sql
    source: aws_postgres_v3
    description: >-
      Batch lookup of AWS PostgreSQL accounts and balances for up to 50
      comma-separated customer emails in a single round-trip.
    parameters:
      - name: emails_csv
        type: string
        description: Comma-separated customer emails, e.g. 'a@example.com,b@example.com'.
    statement: |
      SELECT
        c.email,
        c.name,
        a.type AS account_type,
        a.balance::FLOAT8 AS balance
      FROM customers c
      JOIN accounts a ON a.customer_id = c.id
      WHERE c.email = ANY(string_to_array(REPLACE($1, ' ', ''), ','))
      ORDER BY c.email, a.type
      LIMIT 50;

  pg_top_customers_by_balance_v2:
    kind: postgres-sql
    source: aws_postgres_v3
    description: >-
      Retrieve top customers in AWS PostgreSQL ordered by highest or lowest
      account balance ('checking', 'savings', 'credit', or 'all'), capped at 25.
    parameters:
      - name: account_type
        type: string
        description: Account type filter ('checking', 'savings', 'credit', or 'all').
      - name: sort_order
        type: string
        description: "'desc' for highest balances or 'asc' for lowest/negative balances."
      - name: row_limit
        type: integer
        description: Max rows to return (1 to 25).
    statement: |
      SELECT
        c.name,
        c.email,
        a.type AS account_type,
        a.balance::FLOAT8 AS balance
      FROM accounts a
      JOIN customers c ON c.id = a.customer_id
      WHERE ($1 = 'all' OR LOWER(a.type) = LOWER($1))
      ORDER BY
        CASE WHEN LOWER($2) = 'asc' THEN a.balance END ASC,
        CASE WHEN LOWER($2) <> 'asc' THEN a.balance END DESC
      LIMIT LEAST(GREATEST($3, 1), 25);

  pg_ledger_summary_kpis_v2:
    kind: postgres-sql
    source: aws_postgres_v3
    description: >-
      Compute aggregated financial KPIs across AWS PostgreSQL finance_db
      (account counts, total/average balances by account type).
    statement: |
      SELECT
        type AS account_type,
        COUNT(*) AS account_count,
        ROUND(SUM(balance), 2)::FLOAT8 AS total_balance,
        ROUND(AVG(balance), 2)::FLOAT8 AS avg_balance
      FROM accounts
      GROUP BY type
      ORDER BY total_balance DESC;

  mysql_get_customer_engagement_v2:
    kind: mysql-sql
    source: aws_mysql_v3
    description: >-
      Fetch support tickets and marketing campaign responses from AWS MySQL
      (engagement_db) for a single customer_email.
    parameters:
      - name: customer_email
        type: string
        description: Customer email address.
      - name: customer_email_repeat
        type: string
        description: Same customer email address (used for second UNION branch).
    statement: |
      SELECT 'support_ticket' AS record_type, status AS detail_1, issue AS detail_2
      FROM support_tickets
      WHERE customer_email = ?
      UNION ALL
      SELECT 'campaign_response' AS record_type, campaign_name AS detail_1, response AS detail_2
      FROM campaign_responses
      WHERE customer_email = ?
      LIMIT 30;

  mysql_batch_engagement_by_emails_v2:
    kind: mysql-sql
    source: aws_mysql_v3
    description: >-
      Batch lookup of support tickets and campaign responses in AWS MySQL for up
      to 50 comma-separated customer emails in a single query.
    parameters:
      - name: emails_csv_tickets
        type: string
        description: Comma-separated customer emails without spaces.
      - name: emails_csv_campaigns
        type: string
        description: Same comma-separated customer emails without spaces.
    statement: |
      SELECT customer_email, 'ticket' AS kind, status AS attr, issue AS detail
      FROM support_tickets
      WHERE FIND_IN_SET(customer_email, ?) > 0
      UNION ALL
      SELECT customer_email, 'campaign' AS kind, campaign_name AS attr, response AS detail
      FROM campaign_responses
      WHERE FIND_IN_SET(customer_email, ?) > 0
      LIMIT 50;

  mysql_engagement_summary_kpis_v2:
    kind: mysql-sql
    source: aws_mysql_v3
    description: >-
      Return aggregated ticket counts by status and campaign response counts
      across AWS MySQL engagement_db.
    statement: |
      SELECT 'ticket_status' AS metric_group, status AS bucket, COUNT(*) AS record_count
      FROM support_tickets
      GROUP BY status
      UNION ALL
      SELECT CONCAT('campaign:', campaign_name) AS metric_group, response AS bucket, COUNT(*) AS record_count
      FROM campaign_responses
      GROUP BY campaign_name, response
      LIMIT 40;

toolsets:
  ccca_aws_operational_v3:
    - pg_get_customer_360_v2
    - pg_batch_accounts_by_emails_v2
    - pg_top_customers_by_balance_v2
    - pg_ledger_summary_kpis_v2
    - mysql_get_customer_engagement_v2
    - mysql_batch_engagement_by_emails_v2
    - mysql_engagement_summary_kpis_v2
